# Render Blueprint. Push this repo, then in Render click
# "New +" -> "Blueprint" and point it at your GitHub repo. Render reads
# this file and creates the web service + a free Postgres for you.
#
# The ONLY thing you must set by hand is PSEUDOGRAM_API_KEY (it's marked
# sync:false so Render prompts you for it instead of storing it in git).
services:
  - type: web
    name: linkplease
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PSEUDOGRAM_API_KEY
        sync: false
      - key: VERIFY_SIGNATURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: linkplease-db
          property: connectionString

databases:
  - name: linkplease-db
    plan: free
